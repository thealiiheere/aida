<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Store console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M4 3h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3.5V14H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z' fill='%231d5fbf'/%3E%3C/svg%3E">
<style>
/* Achromatic ledger: no colour in the chrome. The one hue (#1d5fbf) marks held stock and the
   15-minute hold clocks; status pills are the only other colour. Ground is a shop's stone.

   Grid, at 1440: canvas = 1440 - 240 sidebar - 2 x 32 padding = 1136.
   Overview row 1: 3 columns of 370.67 + 2 x 12 gaps = 1136; orders span 2 (753.33), shelf 1.
   Overview row 2: 2 x 562 + 12 = 1136. */
:root {
  --ground: #f4f3f1; --surface: #ffffff; --raised: #f3f2f0; --active: #e7e6e3;
  --border: #e6e6e6; --rule: #f0f0f0; --control: #d4d4d4;
  --text: #0a0a0a; --muted: #6b6b6b;
  --primary: #141414; --primary-ink: #ffffff; --secondary: #e5e5e5;
  --hue: #1d5fbf; --hue-pale: #dbe6f6; --sold: #c9c9c9;
  --positive: #2e7d32; --negative: #c4242a; --warning: #92400e;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e;
  --pill-neutral-bg: #eeeeee; --pill-neutral-ink: #3d3d3d;
  --font: "Geist", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --fs-title: 24px; --fs-section: 16px; --fs-kpi: 30px; --fs-body: 14px; --fs-small: 12px;
  --sidebar: 240px; --pad: 32px; --gap: 12px; --card-pad: 20px;
  --radius-card: 8px; --radius-control: 6px; --control-height: 36px; --row: 44px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000; --surface: #111111; --raised: #1b1b1b; --active: #222222;
    --border: #262626; --rule: #1c1c1c; --control: #444444;
    --text: #ffffff; --muted: #a8a8a8;
    --primary: #ffffff; --primary-ink: #000000; --secondary: #262626;
    --hue: #5b93e6; --hue-pale: #16243a; --sold: #4a4a4a;
    --positive: #3fc07a; --negative: #e5566f; --warning: #e5a93b;
    --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a;
    --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
    --pill-warning-bg: #2b2414; --pill-warning-ink: #e5a93b;
    --pill-neutral-bg: #222222; --pill-neutral-ink: #e0e0e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000; --surface: #111111; --raised: #1b1b1b; --active: #222222;
  --border: #262626; --rule: #1c1c1c; --control: #444444;
  --text: #ffffff; --muted: #a8a8a8;
  --primary: #ffffff; --primary-ink: #000000; --secondary: #262626;
  --hue: #5b93e6; --hue-pale: #16243a; --sold: #4a4a4a;
  --positive: #3fc07a; --negative: #e5566f; --warning: #e5a93b;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a;
  --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2b2414; --pill-warning-ink: #e5a93b;
  --pill-neutral-bg: #222222; --pill-neutral-ink: #e0e0e0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: var(--fs-body)/20px var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.money { font-weight: 700; font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100svh; }
.sidebar { position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; padding: 20px 12px 16px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; height: 36px; }
.brand svg { flex: none; }
.brand b { font-size: 15px; font-weight: 500; }
.brand span { display: block; font-size: var(--fs-small); line-height: 16px; color: var(--muted); }
.nav { margin-top: 28px; display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; border-radius: 6px; color: var(--muted); transition: background-color 150ms, color 150ms; }
.nav a svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { color: var(--text); background: var(--raised); }
.nav a[aria-current="page"] { background: var(--active); color: var(--text); }
.setup { margin-top: auto; padding: 16px 12px 0; }
.setup h2 { font-size: var(--fs-small); font-weight: 400; color: var(--muted); margin-bottom: 8px; }
.setup dl { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; column-gap: 8px; font-size: 13px; }
.setup dt { color: var(--muted); }
.setup dd { text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sold); flex: none; }
.dot.on { background: var(--positive); }
.dot.warn { background: var(--warning); }
.setup .docs { display: inline-flex; margin-top: 14px; font-size: 13px; color: var(--muted); }
.setup .docs:hover { color: var(--text); }

.topbar { display: none; }
.canvas { min-width: 0; padding: 28px var(--pad) 48px; }

/* ---------- title row ---------- */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 0 calc(var(--card-pad) + 1px); margin-bottom: 20px; min-height: 52px; }
.head h1 { font-size: var(--fs-title); line-height: 32px; font-weight: 500; letter-spacing: -0.01em; }
.head p { margin-top: 2px; color: var(--muted); font-size: 15px; line-height: 22px; }
.head p strong { color: var(--text); font-weight: 500; }
.head-side { display: flex; align-items: center; gap: 12px; flex: none; }
.fresh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.fresh .live { width: 6px; height: 6px; border-radius: 50%; background: var(--positive); }
.fresh.paused .live { background: var(--sold); }
.fresh.failed { color: var(--negative); }
.fresh.failed .live { background: var(--negative); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-height); padding: 0 14px; border-radius: var(--radius-control); border: 0; font-weight: 500; white-space: nowrap; cursor: pointer; transition: transform 120ms var(--ease), background-color 150ms, opacity 150ms; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { opacity: 0.88; }
.btn.secondary { background: var(--secondary); color: var(--text); }
.btn.secondary:hover { background: var(--active); }
.btn.ghost { height: 30px; padding: 0 10px; background: transparent; border: 1px solid var(--control); font-size: 13px; }
.btn.ghost:hover { background: var(--raised); }
.btn.text { height: auto; padding: 0; background: none; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); }

/* ---------- cards ---------- */
.grid { display: grid; gap: var(--gap); }
.row-1 { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
.row-1 > .span-2 { grid-column: span 2; }
.row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: var(--gap); align-items: stretch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); min-width: 0; display: flex; flex-direction: column; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px var(--card-pad) 12px; }
.card-head h2 { font-size: var(--fs-section); line-height: 24px; font-weight: 500; }
.card-head .aside { font-size: 13px; color: var(--muted); white-space: nowrap; }
.card-head a.aside:hover { color: var(--text); }
.card-foot { margin-top: auto; padding: 12px var(--card-pad) 16px; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.card-foot a { color: var(--text); }
.card-foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* KPIs as the orders list's tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border); margin: 0 var(--card-pad); }
.tabs.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { position: relative; text-align: left; padding: 2px 16px 14px; border: 0; background: none; cursor: pointer; border-left: 1px solid var(--rule); }
.tab:first-child { padding-left: 0; border-left: 0; }
.tab .label { display: block; font-size: 13px; color: var(--muted); transition: color 150ms; }
.tab .value { display: block; font-size: var(--fs-kpi); line-height: 38px; font-weight: 400; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tab .sub { display: block; font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab::after { content: ""; position: absolute; left: 0; right: 16px; bottom: -1px; height: 2px; background: transparent; transition: background-color 150ms; }
.tab:first-child::after { left: 0; }
.tab:not(:first-child)::after { left: 16px; }
.tab:hover .label { color: var(--text); }
.tab[aria-selected="true"] .label { color: var(--text); }
.tab[aria-selected="true"] .value { font-weight: 500; }
.tab[aria-selected="true"]::after { background: var(--text); }
.value.zero { color: var(--muted); }

/* order rows */
.orders { padding: 4px 0 0; }
.subhead { padding: 14px var(--card-pad) 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); }
.quiet { padding: 14px var(--card-pad) 0; color: var(--muted); font-size: 13px; }
.order { display: grid; grid-template-columns: minmax(0, 1fr) 168px 96px 132px; align-items: center; gap: 16px; min-height: 64px; padding: 10px var(--card-pad); border-top: 1px solid var(--rule); cursor: pointer; transition: background-color 150ms; }
.order:first-child { border-top: 0; }
.order:hover { background: var(--raised); }
.order[aria-current="true"] { background: var(--active); }
.who { min-width: 0; }
.who .line1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.who .id { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.who .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .line2 { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order .total { text-align: right; }
.order .act { display: flex; justify-content: flex-end; }

/* the hold clock: time left of the 15-minute hold, in the one hue */
.hold { display: grid; gap: 6px; }
.hold .t { font-size: 13px; line-height: 16px; font-variant-numeric: tabular-nums; }
.hold .t.late { color: var(--negative); }
.track { height: 4px; border-radius: 2px; background: var(--hue-pale); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--hue); border-radius: 2px; transition: width 900ms linear; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; flex: none; }
.pill.positive { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.pill.negative { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.pill.warning { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
.pill.neutral { background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }

/* shelf */
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--text); }
.legend i.held { background: var(--hue); }
.legend i.sold { background: var(--sold); }
.shelf { padding: 0 var(--card-pad); flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 104px 44px; align-items: center; gap: 12px; min-height: 37px; border-top: 1px solid var(--rule); }
.item:first-child { border-top: 0; }
.item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .count { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.item .count.out { color: var(--negative); }
.bar { display: flex; gap: 2px; height: 6px; }
.bar i { display: block; height: 100%; border-radius: 1px; min-width: 0; }
.bar .shelf-part { background: var(--text); }
.bar .held-part { background: var(--hue); }
.bar .sold-part { background: var(--sold); }
.bar .empty { flex: 1; background: var(--rule); }

/* people, chats and calls */
.list > li { border-top: 1px solid var(--rule); }
.list > li:first-child { border-top: 0; }
.entry { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 10px var(--card-pad); transition: background-color 150ms; }
a.entry:hover, button.entry:hover { background: var(--raised); }
.entry[aria-current="true"] { background: var(--active); }
button.entry { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: #1f1f1f; }
.entry .who, .entry .line1, .entry .line2 { display: block; min-width: 0; }
.entry .line1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .end { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.empty-state { margin: 0 var(--card-pad) var(--card-pad); padding: 14px 16px; border: 1px dashed var(--control); border-radius: 8px; color: var(--muted); font-size: 13px; line-height: 20px; }
.empty-state strong { color: var(--text); font-weight: 500; }
.problem { margin: 0 var(--card-pad) var(--card-pad); padding: 12px 14px; border-radius: 8px; background: var(--pill-warning-bg); color: var(--pill-warning-ink); font-size: 13px; line-height: 20px; }
.skeleton { display: block; height: 14px; border-radius: 3px; background: var(--raised); }

/* ---------- two-pane views ---------- */
.panes { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: var(--gap); align-items: start; }
.panes.wide-detail { grid-template-columns: 380px minmax(0, 1fr); }
.detail { position: sticky; top: 20px; max-height: calc(100svh - 40px); overflow: auto; }
.detail .card-head { position: sticky; top: 0; background: var(--surface); z-index: 1; border-radius: var(--radius-card) var(--radius-card) 0 0; }
.back { display: none; }
.facts { display: grid; grid-template-columns: 132px minmax(0, 1fr); row-gap: 8px; column-gap: 16px; padding: 4px var(--card-pad) 16px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { min-width: 0; overflow-wrap: anywhere; }
.section-title { padding: 16px var(--card-pad) 8px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 12px; font-weight: 400; color: var(--muted); text-align: left; padding: 0 0 8px; }
td { padding: 9px 0; border-top: 1px solid var(--rule); vertical-align: top; }
th + th, td + td { padding-left: 12px; }
th.num, td.num { text-align: right; }
.table-wrap { padding: 0 var(--card-pad) 12px; }
td .sub { display: block; font-size: 12px; color: var(--muted); }

/* conversation */
.convo { padding: 8px var(--card-pad) 20px; display: grid; gap: 10px; }
.say { max-width: 78%; padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 20px; }
.say b { font-weight: 600; }
.say a { text-decoration: underline; text-underline-offset: 3px; }
.say pre, .say code { font-family: var(--mono); font-size: 13px; }
.say .from { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.say.customer { background: var(--raised); justify-self: start; }
.say.aida { border: 1px solid var(--border); justify-self: end; }
.tool, .note { justify-self: stretch; display: flex; gap: 8px; font-size: 13px; line-height: 18px; color: var(--muted); padding: 0 4px; }
.tool svg { flex: none; width: 14px; height: 14px; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tool.failed { color: var(--negative); }
.note { font-size: 12px; }
.note::before { content: attr(data-label); flex: none; color: var(--text); font-weight: 500; }
.langs { display: flex; gap: 2px; margin: 16px 0 0; padding: 2px; border-radius: 8px; background: var(--raised); }
.langs button { flex: 1; min-height: 32px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 13px; cursor: pointer; transition: background-color 150ms, color 150ms; }
.langs button:hover { color: var(--text); }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 0 0 1px var(--border); }
@media (max-width: 1100px) { .langs button { min-height: 44px; } }
.line { padding: 6px 0; border-top: 1px solid var(--rule); white-space: pre-wrap; overflow-wrap: anywhere; }
.line:first-child { border-top: 0; }
.line b { font-weight: 500; }

/* key form */
.gate { max-width: 420px; margin: 8vh auto 0; }
.gate form { display: grid; gap: 10px; padding: 0 var(--card-pad) var(--card-pad); }
.gate label { font-weight: 500; font-size: 14px; }
.gate input { height: 40px; padding: 0 12px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface); font-family: var(--mono); }
.gate p { padding: 0 var(--card-pad) 16px; color: var(--muted); }

@keyframes arrive { from { background-color: var(--hue-pale); } to { background-color: transparent; } }
.new { animation: arrive 2.4s var(--ease) 1; }
@media (prefers-reduced-motion: reduce) {
  .new { animation: none; }
  .track i { transition: none; }
  .btn:active { transform: none; }
}

/* ---------- narrower ---------- */
@media (max-width: 1280px) {
  .order { grid-template-columns: minmax(0, 1fr) 140px 88px; }
  .order .act { display: none; }
}
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: fixed; inset: 48px 0 0 0; z-index: 20; height: auto; background: var(--ground); padding: 16px; }
  .sidebar.open .brand { display: none; }
  .sidebar.open .nav { margin-top: 0; }
  .sidebar.open .nav a { height: 44px; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 21; height: 48px; align-items: center; gap: 10px; padding: 0 16px; background: var(--ground); border-bottom: 1px solid var(--border); }
  .topbar b { font-weight: 500; }
  .topbar .where { color: var(--muted); }
  .topbar button { margin-left: auto; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
  .topbar button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .canvas { padding: 20px 24px 40px; }
  .row-1 { grid-template-columns: minmax(0, 1fr); }
  .row-1 > .span-2 { grid-column: auto; }
  .item { grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 44px; }
  .order .act { display: flex; }
  .order { grid-template-columns: minmax(0, 1fr) 150px 96px 132px; }
  .panes, .panes.wide-detail { grid-template-columns: minmax(0, 1fr) 360px; }
  .detail { top: 64px; max-height: calc(100svh - 80px); }
}
@media (max-width: 860px) {
  .head { flex-direction: column; gap: 10px; }
  .row-2 { grid-template-columns: minmax(0, 1fr); }
  .panes, .panes.wide-detail { grid-template-columns: minmax(0, 1fr); }
  .panes.has-detail > .listing { display: none; }
  .panes:not(.has-detail) > .detail { display: none; }
  .detail { position: static; max-height: none; }
  .back { display: inline-flex; }
  .order .act { display: none; }
  .order { grid-template-columns: minmax(0, 1fr) 130px 88px; }
}

function pickForm(forms, n) {
  if (!Array.isArray(forms)) return forms;
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}
const fill = (text, v) => v ? text.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "") : text;
// One piece of English in the viewer's language.
function t(english, v) {
  const found = LANG === "en" ? null : DICT[LANG]?.[english];
  return fill(found == null ? english : pickForm(found, v?.n ?? 0), v);
}
// A counted phrase: English has its own one/many wording; the others count in DICT.
function tn(n, one, many, v = {}) {
  const values = { ...v, n };
  if (LANG === "en") return fill(n === 1 ? one : many, values);
  return t(many, values);
}

const POLL_MS = 3000;

// ---------- formatting ----------
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const money = (v) => usd.format(Number(v) || 0);
const soum = (v) => `${new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(Number(v) || 0)} ${t("soum")}`;
const now = () => Date.now() + S.offset;
const pad = (n) => String(n).padStart(2, "0");
const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function when(iso) {
  if (!iso) return "—";
  const d = new Date(iso), today = new Date(now());
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(today) - day(d)) / 86400000);
  if (diff === 0) return t("Today {t}", { t: hm(d) });
  if (diff === 1) return t("Yesterday {t}", { t: hm(d) });
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hm(d)}`;
}
function ago(iso) {
  if (!iso) return "—";
  const s = Math.max(0, (now() - Date.parse(iso)) / 1000);
  if (s < 45) return t("Just now");
  if (s < 3600) return t("{n} min ago", { n: Math.round(s / 60) });
  if (s < 86400) return t("{n} h ago", { n: Math.round(s / 3600) });
  return when(iso);
}
const clock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const duration = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const initials = (name) => (name || "?").replace(/^@/, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
function tint(seed) {
  let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${(h % 12) * 30} 55% 88%)`;
}

// ---------- data ----------
async function api(path) {
  const r = await fetch(path, { headers: S.key ? { "X-API-Key": S.key } : {}, cache: "no-store" });
  if (r.status === 401) { const e = new Error("key"); e.auth = true; throw e; }
  if (!r.ok) {
    let message = t("The store answered {s}.", { s: r.status });
    try { message = (await r.json()).detail.message || message; } catch (_) {}
    const e = new Error(message); e.status = r.status; throw e;
  }
  return r.json();
}

let timer = null;
async function poll() {
  clearTimeout(timer);
  try {
    const d = await api("/api/console");
    S.offset = Date.parse(d.now) - Date.now();
    noteArrivals(d);
    S.data = d; S.lastOk = new Date(); S.error = null; S.needKey = false;
    await refreshDetail();
  } catch (e) {
    if (e.auth) S.needKey = true;
    else S.error = e.status ? e.message : t("Can't reach the store backend.");
  }
  S.loading = false;
  render();
  if (!S.needKey && !document.hidden) timer = setTimeout(poll, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); else clearTimeout(timer); renderFresh(); });

function noteArrivals(d) {
  const ids = new Set([
    ...d.orders.map((o) => `o${o.order_id}:${o.status}`),
    ...d.calls.map((c) => `c${c.call_id}`),
    ...d.chats.items.map((c) => `m${c.chat_id}:${c.messages}:${c.state}`),
  ]);
  S.fresh = new Set();
  if (S.seen) for (const id of ids) if (!S.seen.has(id)) S.fresh.add(id.split(":")[0]);
  S.seen = ids;
}

async function refreshDetail() {
  S.detailError = null;
  try {
    if (S.view === "chats" && S.id) S.chat = await api(`/api/console/chats/${encodeURIComponent(S.id)}`);
    if (S.view === "calls" && S.id && (!S.call || S.call.call_id !== S.id)) S.call = await api(`/api/console/calls/${encodeURIComponent(S.id)}`);
  } catch (e) {
    if (e.auth) throw e;
    S.detailError = e.message;
    if (S.view === "chats") S.chat = null; else S.call = null;
  }
}

const loadDetail = () => refreshDetail().catch(() => { S.needKey = true; }).then(render);

// ---------- routing ----------
const TITLES = { overview: "Overview", orders: "Orders", chats: "Chats", calls: "Calls", shelf: "Shelf" };
function route() {
  const [, view = "overview", id = null] = location.hash.replace(/^#/, "").split("/");
  const next = TITLES[view] ? view : "overview";
  const changed = next !== S.view || (id && decodeURIComponent(id)) !== S.id;
  S.view = next; S.id = id ? decodeURIComponent(id) : null;
  if (changed) { S.chat = null; S.call = null; S.detailError = null; viewBuilt = null; }
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("menu").setAttribute("aria-expanded", "false");
  if (changed && S.data) loadDetail();
  render();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.getElementById("menu").addEventListener("click", (e) => {
  const open = document.getElementById("sidebar").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});

  el.innerHTML = html; el._html = html; return true;
}

function renderFresh() {
  const el = $("fresh"); if (!el) return;
  let cls = "fresh", text;

  else if (!S.lastOk) text = t("Connecting");
  else if (document.hidden) { cls += " paused"; text = t("Paused · updated {t}", { t: at }); }

function soonestHeld(withTimeLeft) {
  const held = (S.data?.orders || []).filter((o) => o.status === "pending" && o.reserved_until && (!withTimeLeft || Date.parse(o.reserved_until) > now()));
  held.sort((a, b) => Date.parse(a.reserved_until) - Date.parse(b.reserved_until));
  return held[0] || null;
}
const unpaidInvoice = (o) => o.invoices.find((i) => i.status === "unpaid");

function finding() {
  const d = S.data; if (!d) return `<span class="skeleton" style="width:320px"></span>`;
  const c = d.counts, people = d.chats.items.filter((x) => x.state === "with_person").length;
  const parts = [];
  if (c.escalated.count) parts.push(`<strong>${esc(tn(c.escalated.count, "{n} order needs a person", "{n} orders need a person"))}</strong>`);
  if (people) parts.push(`<strong>${esc(tn(people, "{n} chat is with a person", "{n} chats are with a person"))}</strong>`);
  if (c.pending.count) {
    const first = soonestHeld();
    parts.push(esc(tn(c.pending.count, "{n} order on hold for {m}", "{n} orders on hold for {m}", { m: money(c.pending.total) })) +
      (first ? t(", the next hold ends in {t}", { t: `<span data-until="${esc(first.reserved_until)}" data-fmt="in"></span>` }) : ""));
  }
  if (!parts.length) {
    if (!d.orders_total) return t("No orders yet. They appear here the moment Aida places one.");
    return esc(tn(c.paid.count, "Nothing on hold. {n} order paid for {m} so far.", "Nothing on hold. {n} orders paid for {m} so far.", { m: money(c.paid.total) }));
  }
  return parts.join(" · ");
}

function renderHead() {
  const d = S.data;
  let title = t(TITLES[S.view]), sub = "", action = "";
  if (S.view === "overview") {
    sub = finding();
    const first = soonestHeld(true), inv = first && unpaidInvoice(first);

  } else if (!d) sub = `<span class="skeleton" style="width:240px"></span>`;
  else if (S.view === "orders") sub = d.orders_total > d.orders.length ? tn(d.orders_total, "{n} order · the newest {k} are shown", "{n} orders · the newest {k} are shown", { k: d.orders.length }) : tn(d.orders_total, "{n} order since the store opened", "{n} orders since the store opened");
  else if (S.view === "chats") sub = d.chats.available ? tn(d.chats.items.length, "{n} conversation on Telegram, most recent first", "{n} conversations on Telegram, most recent first") : esc(t(d.chats.note));
  else if (S.view === "calls") sub = tn(d.calls.length, "{n} finished call, newest first. Calls in progress appear once they end.", "{n} finished calls, newest first. Calls in progress appear once they end.");
  else if (S.view === "shelf") {
    const held = d.shelf.reduce((n, p) => n + p.held, 0), out = d.shelf.filter((p) => p.on_shelf === 0).length;
    sub = `${tn(d.shelf.length, "{n} product", "{n} products")} · ${tn(held, "{n} item held in unpaid orders", "{n} items held in unpaid orders")}` + (out ? ` · ${t("{n} out of stock", { n: out })}` : "");
  }
  patch($("head"), `<div><h1>${esc(title)}</h1><p id="finding">${sub}</p></div><div class="head-side"><div class="fresh" id="fresh"></div>${action}</div>`);
  renderFresh();
}

  return `<div>${pill(STATUS[o.status].pill)}</div>`;
}
const itemsLine = (o) => o.items.map((i) => `${i.quantity} × ${i.title}${i.variant ? ` (${i.variant})` : ""}`).join(", ");

function orderRow(o, href, current) {
  const inv = unpaidInvoice(o);
  const act = S.data.store.payments === "demo" && inv && (o.status === "pending" || o.status === "escalated")
    ? `<a class="btn ghost" href="/pay/${esc(inv.invoice_id)}" target="_blank" rel="noopener" data-stop>${t("Open checkout")}</a>` : "";
  const username = o.customer_telegram_username ? ` · @${esc(o.customer_telegram_username)}` : "";
  return `<li class="order${S.fresh.has("o" + o.order_id) ? " new" : ""}" data-href="${href}"${current ? ' aria-current="true"' : ""}>
    <div class="who"><div class="line1"><span class="id">#${o.order_id}</span><a class="name" href="${href}">${esc(o.customer_name)}</a></div>
      <div class="line2">${esc(itemsLine(o))}${username}</div></div>
    <div class="hold-cell">${holdCell(o)}</div>
    <div class="total"><span class="money">${money(o.total_amount)}</span></div>
    <div class="act">${act}</div></li>`;
}

function tabs(selected, attr, withAll) {
  const c = S.data.counts;
  const cell = (key, label, count, sub) => `<button class="tab" type="button" role="tab" ${attr}="${key}" aria-selected="${selected === key}">
    <span class="label">${esc(t(label))}</span><span class="value${count ? "" : " zero"}">${count}</span><span class="sub">${sub}</span></button>`;
  const cells = ["pending", "escalated", "paid", "cancelled_expired"].map((k) => cell(k, STATUS[k].tab, c[k].count, money(c[k].total)));
  if (withAll) cells.unshift(cell("all", "All orders", S.data.orders_total, t("Newest first")));
  return `<div class="tabs${withAll ? " five" : ""}" role="tablist" aria-label="${t("Orders by status")}">${cells.join("")}</div>`;
}

const EMPTY_ORDERS = {
  pending: "<strong>Nothing on hold.</strong> When Aida places an order, its items are held here for 15 minutes while the customer pays.",
  escalated: "<strong>Nobody is waiting for a person.</strong> Orders a customer was handed over on stay here, stock held, until someone decides.",
  paid: "<strong>No paid orders yet.</strong> Paying through a payment link moves an order here.",
  cancelled_expired: "<strong>No expired orders.</strong> Orders not paid within 15 minutes land here and their stock goes back on the shelf.",
  all: "<strong>No orders yet.</strong> Message the bot on Telegram or call the store line, and Aida's orders appear here as she places them.",
};

function renderOverview() {
  const d = S.data;
  if (!d) {
    const sk = (h, n) => `<div class="card-head"><h2>${t(h)}</h2></div>` + Array.from({ length: n }, () => `<div class="item" style="padding:16px 20px"><span class="skeleton" style="width:60%"></span></div>`).join("");
    patch($("ov-orders"), sk("Orders", 5)); patch($("ov-shelf"), sk("Shelf", 5)); patch($("ov-chats"), sk("Chats", 3)); patch($("ov-calls"), sk("Calls", 3));
    if (S.error) patch($("ov-orders"), `<div class="card-head"><h2 id="t-orders">${t("Orders")}</h2></div><p class="problem">${t("{e} Start it with {c}.", { e: esc(S.error), c: '<span class="mono">uv run uvicorn app.main:app --port 8000</span>' })}</p>`);
    return;
  }
  const rows = d.orders.filter((o) => o.status === S.tab);
  const shown = rows.slice(0, 6);
  // A short tab is topped up to three rows with the newest other orders, so the card has no hole.
  const others = shown.length < 3 ? d.orders.filter((o) => o.status !== S.tab).slice(0, 3 - shown.length) : [];
  const list = shown.length ? `<ul class="orders">${shown.map((o) => orderRow(o, `#/orders/${o.order_id}`)).join("")}</ul>`
    : d.orders_total ? `<p class="quiet">${t(EMPTY_ORDERS[S.tab])}</p>` : `<p class="empty-state" style="margin-top:16px">${t(EMPTY_ORDERS.all)}</p>`;
  const more = others.length ? `<p class="subhead">${t("Other recent orders")}</p><ul class="orders">${others.map((o) => orderRow(o, `#/orders/${o.order_id}`)).join("")}</ul>` : "";
  const foot = rows.length > shown.length ? t("{n} of {k} shown", { n: shown.length, k: rows.length }) : tn(d.orders_total, "{n} order in all", "{n} orders in all");
  patch($("ov-orders"), `<div class="card-head"><h2 id="t-orders">${t("Orders")}</h2><span class="aside">${t("Stock is held {n} minutes for payment", { n: d.store.hold_minutes })}</span></div>
    ${tabs(S.tab, "data-tab", false)}
    ${list}${more}
    <div class="card-foot"><span>${foot}</span><a href="#/orders">${t("View all orders")}</a></div>`);
  patch($("ov-shelf"), shelfCard(true));
  patch($("ov-chats"), chatsCard());
  patch($("ov-calls"), callsCard());
}

function shelfCard(compact) {
  const d = S.data;
  const max = Math.max(1, ...d.shelf.map((p) => p.on_shelf + p.held + p.sold));
  const items = d.shelf.map((p) => {
    const w = (n) => `${(n / max) * 100}%`;
    const said = t("{t}: {a} on shelf, {b} held, {c} sold", { t: p.title, a: p.on_shelf, b: p.held, c: p.sold });
    return `<li class="item" title="${esc(said)}"><span class="title">${esc(p.title)}</span>
      <span class="bar" role="img" aria-label="${esc(said)}">${p.on_shelf ? `<i class="shelf-part" style="width:${w(p.on_shelf)}"></i>` : ""}${p.held ? `<i class="held-part" style="width:${w(p.held)}"></i>` : ""}${p.sold ? `<i class="sold-part" style="width:${w(p.sold)}"></i>` : ""}<i class="empty"></i></span>
      <span class="count${p.on_shelf ? "" : " out"}">${p.on_shelf}</span></li>`;
  }).join("");
  return `<div class="card-head"><h2 id="t-shelf">${t("Shelf")}</h2><div class="legend" aria-hidden="true"><span><i></i>${t("On shelf")}</span><span><i class="held"></i>${t("Held")}</span><span><i class="sold"></i>${t("Sold")}</span></div></div>
    <ul class="shelf">${items}</ul>${compact ? `<div class="card-foot"><span>${tn(d.shelf.reduce((n, p) => n + p.held, 0), "{n} item held now", "{n} items held now")}</span><a href="#/shelf">${t("Prices and details")}</a></div>` : ""}`;
}

// ----- chats and calls -----
const chatName = (c) => c.customer_name || (c.username ? `@${c.username}` : `Telegram ${c.chat_id}`);
function chatEntry(c, current, tag = "a") {
  const last = c.last_text ? `${c.last_from === "aida" ? "Aida: " : ""}${c.last_text.replace(/\s+/g, " ")}` : t("No messages yet");
  const state = CHAT_STATE[c.state] ? pill(CHAT_STATE[c.state]) : "";
  return `<${tag} class="entry${S.fresh.has("m" + c.chat_id) ? " new" : ""}" href="#/chats/${c.chat_id}"${current ? ' aria-current="true"' : ""}>
    <span class="avatar" style="background:${tint(c.chat_id)}" aria-hidden="true">${esc(initials(chatName(c)))}</span>
    <span class="who"><span class="line1"><span class="name">${esc(chatName(c))}</span></span><span class="line2">${esc(last)}</span></span>
    <span class="end"><span>${esc(ago(c.active_at))}</span>${state}</span></${tag}>`;
}
// Chats and calls share a row, so they show the same number of rows: 3 or 4.
const pairRows = () => Math.max(3, Math.min(4, S.data.chats.items.length, S.data.calls.length));
function chatsCard() {
  const ch = S.data.chats, n = pairRows();
  const body = !ch.available ? `<p class="empty-state">${startIt(ch.note, "uv run python -m chat")}</p>`
    : !ch.items.length ? `<p class="empty-state">${esc(t(ch.note))}</p>`
    : `<ul class="list">${ch.items.slice(0, n).map((c) => `<li>${chatEntry(c)}</li>`).join("")}</ul>`;
  const people = ch.items.filter((c) => c.state === "with_person").length;
  return `<div class="card-head"><h2 id="t-chats">${t("Chats")}</h2><span class="aside">${people ? tn(people, "{n} chat with a person", "{n} chats with a person") : "Telegram"}</span></div>${body}
    <div class="card-foot"><span>${ch.items.length > n ? t("{n} of {k} shown", { n, k: ch.items.length }) : tn(ch.items.length, "{n} conversation", "{n} conversations")}</span><a href="#/chats">${t("View all chats")}</a></div>`;
}
const callerName = (c) => c.caller_name || (c.caller_username ? `@${c.caller_username}` : c.caller_telegram_id ? `Telegram ${c.caller_telegram_id}` : t("Unlinked caller"));
function callEntry(c, current) {
  const state = c.outcome ? pill(OUTCOME[c.outcome] || ["neutral", c.outcome]) : pill(["neutral", "Not summarised"]);
  return `<a class="entry${S.fresh.has("c" + c.call_id) ? " new" : ""}" href="#/calls/${encodeURIComponent(c.call_id)}"${current ? ' aria-current="true"' : ""}>
    <span class="avatar" style="background:${tint(c.caller_telegram_id || c.call_id)}" aria-hidden="true">${esc(initials(callerName(c)))}</span>
    <span class="who"><span class="line1"><span class="name">${esc(callerName(c))}</span></span><span class="line2">${esc(c.customer_intent || t("No summary: the transcript is all there is."))}</span></span>
    <span class="end"><span>${esc(ago(c.created_at))} · ${duration(c.duration_seconds)}</span>${state}</span></a>`;
}
function callsCard() {
  const calls = S.data.calls, n = pairRows();
  const body = calls.length ? `<ul class="list">${calls.slice(0, n).map((c) => `<li>${callEntry(c)}</li>`).join("")}</ul>`
    : `<p class="empty-state">${t(NO_CALLS)}</p>`;
  return `<div class="card-head"><h2 id="t-calls">${t("Calls")}</h2><span class="aside">${t("Store phone line")}</span></div>${body}
    <div class="card-foot"><span>${calls.length > n ? t("{n} of {k} shown", { n, k: calls.length }) : tn(calls.length, "{n} finished call", "{n} finished calls")}</span><a href="#/calls">${t("View all calls")}</a></div>`;
}

// ----- views with a detail pane -----
const wide = () => matchMedia("(min-width: 861px)").matches;
function setDetail(has) { $("panes")?.classList.toggle("has-detail", has); }
const backLink = (href, label) => `<a class="btn text back" href="${href}">${t(label)}</a>`;
const NO_CALLS = "<strong>No calls yet.</strong> Each call to the store line shows up here when it ends, with the AI's summary and the transcript.";
const startIt = (note, command) => t("{e} Start it with {c}.", { e: esc(t(note)), c: `<span class="mono">${command}</span>` });

function renderOrders() {
  const d = S.data; if (!d) return;
  const rows = S.ordersTab === "all" ? d.orders : d.orders.filter((o) => o.status === S.ordersTab);
  let id = S.id ? Number(S.id) : null;
  if (!id && wide() && rows.length) id = rows[0].order_id;
  patch($("v-list"), `<div class="card-head"><h2>${t("All orders")}</h2></div>${tabs(S.ordersTab, "data-orders-tab", true)}
    ${rows.length ? `<ul class="orders">${rows.map((o) => orderRow(o, `#/orders/${o.order_id}`, o.order_id === id)).join("")}</ul>` : `<p class="empty-state" style="margin-top:16px">${t(EMPTY_ORDERS[S.ordersTab])}</p>`}`);
  const o = d.orders.find((x) => x.order_id === id);
  setDetail(Boolean(S.id));
  patch($("v-detail"), o ? orderDetail(o) : `<div class="card-head"><h2>${t("Order")}</h2>${backLink("#/orders", "All orders")}</div><p class="empty-state">${id ? t("Order #{id} isn't among the newest {n}.", { id: esc(id), n: d.orders.length }) : t("Choose an order to see its items, payment links and payments.")}</p>`);
}

function orderDetail(o) {
  const items = o.items.map((i) => `<tr><td>${esc(i.title)}${i.variant ? `<span class="sub">${esc(i.variant)}</span>` : ""}</td><td class="num">${i.quantity}</td><td class="num">${money(i.unit_price)}</td><td class="num">${money(i.line_total)}</td><td class="muted">${t({ reserved: "Held", sold: "Sold", released: "Back on shelf" }[i.state])}</td></tr>`).join("");
  const invoices = o.invoices.length ? `<div class="section-title">${t("Payment links")}</div><div class="table-wrap"><table><thead><tr><th>${t("Provider")}</th><th>${t("Link")}</th><th class="num">${t("Amount")}</th><th>${t("State")}</th></tr></thead><tbody>${o.invoices.map((i) => `<tr><td>${i.provider === "click" ? "Click" : "Payme"}</td><td><a class="mono" href="/pay/${esc(i.invoice_id)}" target="_blank" rel="noopener" title="${esc(i.payment_url)}">${esc(i.invoice_id.slice(0, 12))}…</a></td><td class="num">${money(i.amount)}</td><td>${i.status === "paid" ? pill(["positive", "Paid"]) : `<span class="muted">${t("Unpaid")}</span>`}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="section-title">${t("Payment links")}</div><p class="empty-state">${t("No payment link yet. Aida makes one right after placing the order.")}</p>`;
  const tx = o.transactions.length ? `<div class="section-title">${t("Gateway payments")}</div><div class="table-wrap"><table><thead><tr><th>${t("Gateway")}</th><th>${t("Their id")}</th><th class="num">${t("Amount")}</th><th>${t("State")}</th></tr></thead><tbody>${o.transactions.map((x) => `<tr><td>${x.provider === "click" ? "Click" : "Payme"}</td><td class="mono">${esc(x.external_id.slice(0, 10))}${x.external_id.length > 10 ? "…" : ""}</td><td class="num">${soum(x.amount_uzs)}</td><td>${t({ created: "Started", paid: "Paid", cancelled: "Cancelled" }[x.state])}</td></tr>`).join("")}</tbody></table></div>` : "";
  const user = o.customer_telegram_username ? `<a href="https://t.me/${esc(o.customer_telegram_username)}" target="_blank" rel="noopener">@${esc(o.customer_telegram_username)}</a> · ` : "";
  return `<div class="card-head"><h2>${t("Order #{id}", { id: o.order_id })}</h2>${backLink("#/orders", "All orders")}</div>
    <div style="padding:0 var(--card-pad) 16px">${holdCell(o)}</div>
    <dl class="facts"><dt>${t("Customer")}</dt><dd>${esc(o.customer_name)}</dd><dt>Telegram</dt><dd>${user}<span class="mono">${esc(o.customer_telegram_id)}</span></dd>
      <dt>${t("Deliver to")}</dt><dd>${esc(o.delivery_address)}</dd><dt>${t("Placed")}</dt><dd>${esc(when(o.created_at))}</dd><dt>${t("Total")}</dt><dd class="money">${money(o.total_amount)}</dd></dl>
    <div class="section-title">${t("Items")}</div><div class="table-wrap"><table><thead><tr><th>${t("Product")}</th><th class="num">${t("Qty")}</th><th class="num">${t("Price")}</th><th class="num">${t("Line")}</th><th>${t("Stock")}</th></tr></thead><tbody>${items}</tbody></table></div>
    ${invoices}${tx}`;
}

function renderChats() {
  const d = S.data; if (!d) return;
  const ch = d.chats;
  let id = S.id;
  if (!id && wide() && ch.items.length) { id = String(ch.items[0].chat_id); S.id = id; loadDetail(); }
  patch($("v-list"), `<div class="card-head"><h2>${t("Conversations")}</h2></div>${!ch.available ? `<p class="empty-state">${startIt(ch.note, "uv run python -m chat")}</p>`
    : ch.items.length ? `<ul class="list">${ch.items.map((c) => `<li>${chatEntry(c, String(c.chat_id) === id)}</li>`).join("")}</ul>` : `<p class="empty-state">${esc(t(ch.note))}</p>`}`);
  setDetail(Boolean(S.id) && !location.hash.endsWith("/chats"));
  const c = S.chat;
  if (!c) { patch($("v-detail"), `<div class="card-head"><h2>${t("Conversation")}</h2>${backLink("#/chats", "All chats")}</div>${S.detailError ? `<p class="problem">${esc(S.detailError)}</p>` : `<p class="empty-state">${id ? t("Loading the conversation…") : t("Choose a conversation to read it.")}</p>`}`); return; }
  const lines = c.entries.map((e) => {
    if (e.kind === "customer") return `<div class="say customer"><span class="from">${esc(chatName(c))}</span>${esc(e.text)}</div>`;
    // Telegram HTML from the store's own formatter: escaped, with only the tags Telegram allows.
    if (e.kind === "aida") return `<div class="say aida"><span class="from">Aida</span>${e.html ?? esc(e.text)}</div>`;
    if (e.kind === "tool") return `<div class="tool${e.ok === false ? " failed" : ""}">${ICON_TOOL}<span>${esc(e.text)}</span></div>`;
    return `<div class="note" data-label="${esc(t("Store note"))}"><span>${esc(e.text)}</span></div>`;
  }).join("");
  const state = c.state === "with_person" ? t("A person took over {t}. Aida is quiet in this chat until someone replies /resume.", { t: esc(ago(c.paused_at)).toLowerCase() }) : c.state === "answering" ? t("Aida is writing an answer.") : t("Aida is handling this chat.");
  const user = c.username ? `<a href="https://t.me/${esc(c.username)}" target="_blank" rel="noopener">@${esc(c.username)}</a> · ` : "";
  const wasBottom = (() => { const el = $("v-detail"); return !el._html || el.scrollHeight - el.scrollTop - el.clientHeight < 40; })();
  const changed = patch($("v-detail"), `<div class="card-head"><h2>${esc(chatName(c))}</h2>${backLink("#/chats", "All chats")}</div>
    <dl class="facts"><dt>Telegram</dt><dd>${user}<span class="mono">${c.chat_id}</span></dd><dt>${t("Now")}</dt><dd>${state}</dd><dt>${t("Last active")}</dt><dd>${esc(when(c.active_at))}</dd>
    ${c.failures ? `<dt>${t("AI")}</dt><dd>${tn(c.failures, "Didn't answer {n} time in a row", "Didn't answer {n} times in a row")}</dd>` : ""}${c.waiting ? `<dt>${t("Waiting")}</dt><dd>${tn(c.waiting, "{n} message not answered yet", "{n} messages not answered yet")}</dd>` : ""}</dl>
    <div class="section-title">${t("Conversation")}</div><div class="convo">${lines || `<p class="muted">${t("Nothing said yet.")}</p>`}</div>`);
  if (changed && wasBottom && wide()) { const el = $("v-detail"); el.scrollTop = el.scrollHeight; }
}

function renderCalls() {
  const d = S.data; if (!d) return;
  let id = S.id;
  if (!id && wide() && d.calls.length) { id = d.calls[0].call_id; S.id = id; loadDetail(); }
  patch($("v-list"), `<div class="card-head"><h2>${t("Finished calls")}</h2></div>${d.calls.length ? `<ul class="list">${d.calls.map((c) => `<li>${callEntry(c, c.call_id === id)}</li>`).join("")}</ul>`
    : `<p class="empty-state">${t(NO_CALLS)}</p>`}`);
  setDetail(Boolean(S.id) && !location.hash.endsWith("/calls"));
  const c = S.call;
  if (!c) { patch($("v-detail"), `<div class="card-head"><h2>${t("Call")}</h2>${backLink("#/calls", "All calls")}</div>${S.detailError ? `<p class="problem">${esc(S.detailError)}</p>` : `<p class="empty-state">${id ? t("Loading the call…") : t("Choose a call to read its summary and transcript.")}</p>`}`); return; }
  const lines = c.transcript.split(/\n+/).filter((l) => l.trim()).map((l) => {
    const m = l.match(/^\s*(Caller|Aida|Customer)\s*:\s*(.*)$/i);
    const who = /^aida$/i.test(m?.[1] || "") ? "Aida" : t("Caller");
    return m ? `<p class="line"><b>${esc(who)}:</b> ${esc(m[2])}</p>` : `<p class="line">${esc(l)}</p>`;
  }).join("");
  patch($("v-detail"), `<div class="card-head"><h2>${esc(callerName(c))}</h2>${backLink("#/calls", "All calls")}</div>
    <dl class="facts"><dt>${t("Outcome")}</dt><dd>${c.outcome ? pill(OUTCOME[c.outcome] || ["neutral", c.outcome]) : `<span class="muted">${t("Not summarised yet")}</span>`}</dd>
      <dt>${t("Wanted")}</dt><dd>${esc(c.customer_intent || "—")}</dd><dt>${t("Items discussed")}</dt><dd>${esc(c.items_discussed || "—")}</dd>
      <dt>${t("Length")}</dt><dd class="num">${duration(c.duration_seconds)}</dd><dt>${t("Ended")}</dt><dd>${esc(when(c.created_at))}</dd>
      <dt>${t("Admin")}</dt><dd>${c.reported ? t("Sent the summary") : `<span class="muted">${t("Not told yet")}</span>`}</dd><dt>${t("Call id")}</dt><dd class="mono">${esc(c.call_id)}</dd></dl>
    <div class="section-title">${t("Transcript")}</div><div class="convo">${lines || `<p class="muted">${t("Nobody said anything.")}</p>`}</div>`);
}

function renderShelfView() {
  const d = S.data;
  if (!d) return;
  const rows = d.shelf.map((p) => `<tr><td><b style="font-weight:500">${esc(p.title)}</b><span class="sub">${esc(p.category)}</span></td><td class="num">${money(p.price)}</td>
    <td class="num">${p.on_shelf === 0 ? '<span style="color:var(--negative);font-weight:500">0</span>' : p.on_shelf}</td><td class="num">${p.held || '<span class="muted">0</span>'}</td><td class="num">${p.sold || '<span class="muted">0</span>'}</td>
    <td class="num hide-phone">${money(p.price * (p.on_shelf))}</td></tr>`).join("");
  const worth = d.shelf.reduce((n, p) => n + Math.round(p.price * p.on_shelf * 100), 0) / 100;
  patch($("v-shelf"), `<div class="card-head"><h2>${t("Stock by product")}</h2><span class="aside">${t("Counted per product, not per size or colour")}</span></div>
    <div class="table-wrap"><table><thead><tr><th>${t("Product")}</th><th class="num">${t("Price")}</th><th class="num">${t("On shelf")}</th><th class="num">${t("Held")}</th><th class="num">${t("Sold")}</th><th class="num hide-phone">${t("Shelf value")}</th></tr></thead>
    <tbody>${rows}<tr><td><b style="font-weight:500">${t("Total")}</b></td><td></td><td class="num">${d.shelf.reduce((n, p) => n + p.on_shelf, 0)}</td><td class="num">${d.shelf.reduce((n, p) => n + p.held, 0)}</td><td class="num">${d.shelf.reduce((n, p) => n + p.sold, 0)}</td><td class="num hide-phone money">${money(worth)}</td></tr></tbody></table></div>
    <div class="card-foot"><span>${t("Held items left the shelf when the order was placed. They come back if it isn't paid within {n} minutes.", { n: d.store.hold_minutes })}</span></div>`);
}

// ---------- the clocks ----------
function tick() {
  const at = now(), hold = (S.data?.store.hold_minutes || 15) * 60000, grace = (S.data?.store.expiry_check_seconds || 60) * 1000;
  document.querySelectorAll("[data-until]").forEach((el) => {
    const left = Date.parse(el.dataset.until) - at;
    let text;
    if (el.dataset.fmt === "in") text = left > 0 ? clock(left) : t("a moment");
    else text = left > 0 ? t("{t} left to pay", { t: clock(left) }) : left > -grace ? t("Time's up, releasing stock") : t("Releasing stock");
    if (el.textContent !== text) el.textContent = text;
    el.classList.toggle("late", left < 3 * 60000);
  });
  document.querySelectorAll("[data-hold] .track i").forEach((bar) => {
    const left = Date.parse(bar.closest("[data-hold]").dataset.hold) - at;
    bar.style.width = `${Math.max(0, Math.min(1, left / hold)) * 100}%`;
  });
}
setInterval(tick, 1000);

// ---------- events ----------
document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const otab = e.target.closest("[data-orders-tab]");
  if (otab) { S.ordersTab = otab.dataset.ordersTab; render(); return; }
  if (e.target.closest("[data-retry]")) { poll(); return; }
  const lang = e.target.closest("[data-lang]");
  if (lang) { setLanguage(lang.dataset.lang); return; }
  if (e.target.closest("a, button")) return;
  const row = e.target.closest("[data-href]");
  if (row) location.hash = row.dataset.href;
});
document.addEventListener("keydown", (e) => {
  const tab = e.target.closest?.('[role="tab"]');
  if (!tab || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const all = [...tab.parentElement.children], next = all[(all.indexOf(tab) + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
  next.click(); requestAnimationFrame(() => document.querySelector(`[role="tab"][${next.dataset.tab ? "data-tab" : "data-orders-tab"}="${next.dataset.tab || next.dataset.ordersTab}"]`)?.focus());
});

// ---------- API key ----------
function gate() {
  return `<section class="card gate" aria-labelledby="gate-title"><div class="card-head"><h2 id="gate-title">${t("This store needs its API key")}</h2></div>
    <p>${t("The backend has {k} set. Enter it to see orders, chats and calls. It's kept in this tab only.", { k: '<span class="mono">AGENT_API_KEY</span>' })}</p>
    <form id="gate-form"><label for="key">${t("API key")}</label><input id="key" name="key" type="password" autocomplete="off" required>
    ${S.key ? `<p style="padding:0;color:var(--negative)">${t("That key was refused.")}</p>` : ""}<button class="btn primary" type="submit">${t("Open the console")}</button></form></section>`;
}
function bindGate() {
  const form = $("gate-form"); if (!form || form._bound) return; form._bound = true;
  form.addEventListener("submit", (e) => {
    e.preventDefault(); S.key = form.key.value.trim();
    try { sessionStorage.setItem("aida-api-key", S.key); } catch (_) {}
    viewBuilt = null; S.needKey = false; poll();
  });
}

// ---------- switching language ----------
function translateStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach((el) => { const text = t(el.dataset.t); if (el.textContent !== text) el.textContent = text; });
  document.querySelectorAll("[data-t-label]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tLabel)));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}
function setLanguage(lang) {
  if (!LANG_NAMES[lang] || lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem("aida-lang", lang); } catch (_) {}
  viewBuilt = null;
  for (const id of ["head", "setup", "fresh"]) { const el = $(id); if (el) el._html = null; }
  render();
}

route();
poll();
</script>
</body>
