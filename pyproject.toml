[project]
name = "aida"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Only for the Bluetooth phone line, which runs on Linux.
bluetooth = [
    "dbus-fast>=2.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
